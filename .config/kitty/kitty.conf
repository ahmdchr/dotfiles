# 🔤 Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# 🖤 Background & Foreground
background #120709
foreground #f4d9d5

# 🔳 Cursor
cursor           #ff3548   # crimson highlight
cursor_text_color background

# 🌫️ Transparency
background_opacity 0.45

# 🔴 Selection
selection_background #74202a
selection_foreground #fff1ef

# 🌸 Borders (subtle but aesthetic)
active_border_color   #e51b2b
inactive_border_color #411216

# 🎨 Color Palette (red + pink aesthetic)

color0  #170b0d   # near-black
color1  #c7182a   # crimson
color2  #9c5b61   # dusty rose
color3  #d37d6b   # warm skin tone
color4  #a83843   # wine red
color5  #9b5262   # mauve red
color6  #cc7772   # coral red
color7  #d7b6b2   # soft rose white

color8  #532127   # deep burgundy
color9  #ff3043
color10 #c77c81
color11 #eca18d
color12 #db5360
color13 #c87b89
color14 #f09b91
color15 #fff0ee

# 🧼 Window padding (breathing space)
window_padding_width 10

# ✨ Smooth scrolling
scrollback_lines 10000

# 🚫 Disable annoying bell
enable_audio_bell no

cursor_trail 1
